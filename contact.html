        position: fixed;

        display: flex;

    }
    .icone{position: fixed;}
  
    .social-icons a {
        font-size: 30px;
        color: white;
        background-color: black;
        border-radius: 50%;

        text-decoration: none;
        transition: all 0.3s ease;
    }
  
    .social-icons a:hover {
        background-color: #007bff; /* Couleur de survol pour Facebook */
